[project]
name = "rafiq-api"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "anthropic>=1.15.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.153.0",
    "openai>=3.35.1",
    "pgvector>=0.5.1",
    "pydantic-settings>=2.16.1",
    "pypdf>=6.21.1",
    "pyyaml>=6.0.3",
    "sqlalchemy[asyncio]>=2.1.5",
    "tzdata>=2026.5",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "reportlab>=5.0.1",
    "ruff>=0.17.1",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF"]
# Arabic text is intentional (RUF001-003 flag Arabic letters as look-alikes of Latin ones);
# SIM905: "a b c".split() keeps long word lists readable.
ignore = ["RUF001", "RUF002", "RUF003", "SIM905"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["^alembic/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[[tool.mypy.overrides]]
module = ["reportlab.*"]
ignore_missing_imports = true
