# Retrieval sanity set (M2): checks that the right document is retrieved for each question.
# `must_contain`: short strings a correct answer contains; each one appears literally in the
# expected source document. `cross_lingual`: question language differs from the source language.

# ---------- French ----------
- id: fr-01
  lang: fr
  category: same_lang
  question: "Combien coûte une consultation de cardiologie ?"
  expected_sources: [tarifs.pdf]
  must_contain: ["80 DT"]

- id: fr-02
  lang: fr
  category: same_lang
  question: "Faut-il être à jeun pour une prise de sang ?"
  expected_sources: [preparation-examens.pdf]
  must_contain: ["12 heures"]

- id: fr-03
  lang: fr
  category: same_lang
  question: "Quels jours consulte le Dr Amira Ben Salah ?"
  expected_sources: [medecins.pdf]
  must_contain: ["mercredi", "vendredi"]

- id: fr-04
  lang: fr
  category: same_lang
  question: "Avec la Mutuelle Yasmine, combien je paie pour une consultation ?"
  expected_sources: [assurance.pdf]
  must_contain: ["20 %"]

- id: fr-05
  lang: fr
  category: same_lang
  question: "Quels sont les horaires de la clinique pendant le Ramadan ?"
  expected_sources: [horaires-acces.md]
  must_contain: ["15h"]

- id: fr-06
  lang: fr
  category: cross_lingual
  question: "Y a-t-il du Wi-Fi gratuit à la clinique ? Quel est le nom du réseau ?"
  expected_sources: [faq.md]
  must_contain: ["Rafiq-Patients"]

- id: fr-07
  lang: fr
  category: cross_lingual
  question: "Que se passe-t-il si je ne viens pas à mon rendez-vous sans prévenir ?"
  expected_sources: [politiques.md]
  must_contain: ["20 DT"]

- id: fr-08
  lang: fr
  category: cross_lingual
  question: "En combien de temps les résultats d'analyses sont-ils disponibles en ligne ?"
  expected_sources: [faq.md]
  must_contain: ["48"]

